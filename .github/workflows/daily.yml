name: Sopan daily

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 07:47 IST (02:17 UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to save state/ and docs/data.json back to the repo

concurrency:
  group: sopan-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post to Telegram
        run: python -m sopan.run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save what was seen
        run: |
          git config user.name "sopan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
