name: Sopan daily

on:
  schedule:
    - cron: "17 2,8,14 * * *"   # 07:47, 13:47 and 19:47 IST, so one skipped run never matters
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Test only: show what would be posted, post and save nothing"
        type: boolean
        default: false
      roundup:
        description: "Post every opening that is open right now (one-time list)"
        type: boolean
        default: false

permissions:
  contents: write           # needed to save state/ and docs/data.json back to the repo

concurrency:
  group: sopan-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post to Telegram
        run: python -m sopan.run ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.roundup && '--roundup' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save what was seen
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "sopan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
